server:
    port: 8081

service:
    description: "user-service"

spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/unik?currentSchema=user_schema
        username: unik
        password: unik

    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                default_schema: user_schema

    flyway:
        enabled: true
        locations: classpath:db/migration
        default-schema: user_schema
        schemas: user_schema
        create-schemas: true
        baseline-on-migrate: true
        clean-disabled: true

external:
    company-service:
        base-url: http://localhost:8082

logging:
    level:
        org.flywaydb: DEBUG
        org.springframework.boot.autoconfigure.flyway: DEBUG
        org.springframework.boot.autoconfigure.jdbc: DEBUG

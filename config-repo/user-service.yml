server:
  port: 8081

service:
  description: "user-service"

spring:
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/unik?currentSchema=user_schema}
    username: ${DB_USERNAME:unik}
    password: ${DB_PASSWORD:unik}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: user_schema
    schemas: user_schema
    create-schemas: true
    baseline-on-migrate: true
    clean-disabled: true

external:
  company-service:
    base-url: ${COMPANY_SERVICE_BASE_URL:http://localhost:8080/company}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.boot.autoconfigure.jdbc: DEBUG

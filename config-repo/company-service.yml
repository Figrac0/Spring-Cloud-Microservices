server:
  port: 8082

service:
  description: "company-service"

spring:
  datasource:
    url: ${COMPANY_DB_URL:jdbc:postgresql://localhost:5432/unik?currentSchema=company_schema}
    username: ${DB_USERNAME:unik}
    password: ${DB_PASSWORD:unik}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: company_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: company_schema
    schemas: company_schema
    create-schemas: true
    baseline-on-migrate: true
    clean-disabled: true

external:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8080/user}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

app:
  kafka:
    consumer-group: company-service-company-deletion-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

server:
    port: 8082

service:
    description: "company-service"

spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/unik?currentSchema=company_schema
        username: unik
        password: unik

    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                default_schema: company_schema

    flyway:
        enabled: true
        locations: classpath:db/migration
        default-schema: company_schema
        schemas: company_schema
        create-schemas: true
        baseline-on-migrate: true
        clean-disabled: true

external:
    user-service:
        base-url: http://localhost:8081

logging:
    level:
        org.flywaydb: DEBUG
        org.springframework.boot.autoconfigure.flyway: DEBUG
        org.springframework.boot.autoconfigure.jdbc: DEBUG
